name: Build iOS IPA (unsigned, for sideloading)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install tools
      run: |
        brew install autoconf automake libtool pkg-config
        pip install --upgrade pip cython==0.29.37 kivy-ios

    - name: Build Python + Kivy for iOS (slow, 20-40 min)
      run: |
        toolchain build python3 kivy pyobjus
        toolchain pip install arabic-reshaper "python-bidi==0.4.2" six

    - name: Prepare app folder (without Android-only files)
      run: |
        mkdir -p ios_app
        cp main.py core.py fx.py games_ui.py game_*.py *_data.py trivia_extra.py riddles_extra.py ios_app/ 2>/dev/null || true
        cp *.kv *.png *.jpg *.json *.ttf ios_app/ 2>/dev/null || true
        [ -d sounds ] && cp -r sounds ios_app/sounds || true
        ls ios_app

    - name: Create Xcode project
      run: |
        toolchain create BFBReminder "$PWD/ios_app"
        toolchain icon bfbreminder-ios icon.png || true
        toolchain launchimage bfbreminder-ios presplash.png || true

    - name: Build without signing
      run: |
        cd bfbreminder-ios
        xcodebuild -project bfbreminder.xcodeproj -scheme bfbreminder \
          -configuration Release -sdk iphoneos -arch arm64 \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
          -derivedDataPath build build
        APP=$(find build -name "*.app" -path "*Release-iphoneos*" | head -1)
        echo "app: $APP"
        mkdir -p Payload && cp -r "$APP" Payload/
        zip -r ../BFB-Reminder.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BFB-Reminder-IPA
        path: BFB-Reminder.ipa
