name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
          libffi-dev libssl-dev build-essential ccache
        pip install --upgrade "git+https://github.com/kivy/buildozer.git" "cython<3" setuptools

    - name: Install fixed signing key
      env:
        DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
      run: |
        if [ -z "$DEBUG_KEYSTORE_B64" ]; then
          echo "::error::Secret DEBUG_KEYSTORE_B64 is missing. Add it in Settings > Secrets and variables > Actions."
          exit 1
        fi
        mkdir -p ~/.android
        echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

    - name: Build APK
      run: yes | buildozer -v android debug

    - name: Check boot receiver in manifest
      run: |
        find .buildozer -name AndroidManifest.xml -path "*src/main*" | head -3 | while read f; do
          echo "== $f =="
          grep -n "BootReceiver\|BOOT_COMPLETED" "$f" || echo "!! BootReceiver NOT FOUND"
        done

    - name: Show versions used (to pin them later)
      run: |
        buildozer --version || true
        pip show buildozer | grep -i '^version' || true
        echo "python-for-android commit:"
        git -C .buildozer/android/platform/python-for-android rev-parse HEAD || true

    - name: Re-sign APK with the fixed key
      run: |
        APKSIGNER=$(find ~/.buildozer -name apksigner -type f | sort -V | tail -1)
        ZIPALIGN=$(find ~/.buildozer -name zipalign -type f | sort -V | tail -1)
        if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
          echo "::error::apksigner or zipalign not found in the Android SDK"
          exit 1
        fi
        for f in bin/*.apk; do
          "$ZIPALIGN" -p -f 4 "$f" "$f.aligned"
          "$APKSIGNER" sign --ks ~/.android/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey \
            --out "$f.signed" "$f.aligned"
          mv "$f.signed" "$f"
          rm -f "$f.aligned" "$f.signed.idsig" "$f.idsig"
        done
        echo "Signer certificate (expected to start with c5a5e027):"
        "$APKSIGNER" verify --print-certs bin/*.apk | grep -i "SHA-256"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BFB-Reminder-APK
        path: bin/*.apk
